# Overlay for the existing `webui` service. The environment file must contain
# the matching private DB/Redis credentials and WEBUI_SECRET_KEY, not test keys.
# Set all required paths/devices from the inspected deployment, not examples.
# A cap-drop uid0 worker cannot bypass a uid1000-owned 0700 bind root. Give
# only uid0 a read/traverse ACL on that root (after saving its original ACL),
# not world access or a recursive chmod/chown. Verify actual upload/asset access.
x-indexing: &indexing
  image: ${OPENWEBUI_INDEXING_IMAGE:?set the verified Slim candidate image}
  env_file: ${OPENWEBUI_INDEXING_ENV_FILE:?set the private indexing environment file}
  entrypoint: [python, -m, open_webui.retrieval.ingestion_worker]
  init: true
  restart: unless-stopped
  read_only: true
  mem_limit: 2g
  memswap_limit: 2g
  cpus: 1
  pids_limit: 128
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 15s
  healthcheck:
    test: [CMD, python, -c, "from pathlib import Path; import time; p=Path('/tmp/indexing/worker-ready'); exit(0 if p.exists() and time.time()-p.stat().st_mtime<30 else 1)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 30s
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=536870912,mode=1777
  volumes:
    - type: bind
      source: ${OPENWEBUI_INDEXING_DATA_DIR:?set the existing data directory}
      target: /app/backend/data
    - type: bind
      source: ${OPENWEBUI_INDEXING_DB_BUDGET_DIR:?set an empty directory on the actual DB filesystem}
      target: /db-budget
      read_only: true
  blkio_config:
    device_read_bps:
      - path: ${OPENWEBUI_INDEXING_UPLOAD_DEVICE:?set the inspected upload block device}
        rate: 20mb
    device_write_bps:
      - path: ${OPENWEBUI_INDEXING_UPLOAD_DEVICE:?set the inspected upload block device}
        rate: 10mb

services:
  webui:
    environment:
      UVICORN_WORKERS: '4'
      INDEXING_QUEUE_ENABLED: 'true'
      DATABASE_POOL_SIZE: '5'
      DATABASE_POOL_MAX_OVERFLOW: '2'
      PGVECTOR_POOL_SIZE: '4'
      PGVECTOR_POOL_MAX_OVERFLOW: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4
    restart: unless-stopped
  indexing-0:
    <<: *indexing
    container_name: ${OPENWEBUI_INDEXING_CONTAINER_PREFIX:-owui-live}-indexing-0
    environment: &worker-environment
      INDEXING_WORKER_SLOT: '0'
      INDEXING_QUEUE_ENABLED: 'true'
      INDEXING_TEMP_DIR: /tmp/indexing
      INDEXING_DB_STORAGE_PATH: /db-budget
      INDEXING_STORAGE_MIN_FREE_BYTES: '8589934592'
      INDEXING_STORAGE_RESERVE_BYTES: '2147483648'
      INDEXING_JOB_TIMEOUT: '1200'
      ENABLE_DB_MIGRATIONS: 'false'
      STATIC_DIR: /tmp/static
      DATABASE_POOL_SIZE: '0'
      DATABASE_POOL_MAX_OVERFLOW: '0'
      PGVECTOR_POOL_SIZE: '0'
      PGVECTOR_POOL_MAX_OVERFLOW: '0'
      PGOPTIONS: '-c statement_timeout=30000 -c lock_timeout=3000 -c idle_in_transaction_session_timeout=30000'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
  indexing-1:
    <<: *indexing
    container_name: ${OPENWEBUI_INDEXING_CONTAINER_PREFIX:-owui-live}-indexing-1
    environment:
      <<: *worker-environment
      INDEXING_WORKER_SLOT: '1'
