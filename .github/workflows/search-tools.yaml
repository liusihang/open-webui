name: Search Tool Contracts

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'tools/search/**'
      - 'backend/open_webui/utils/middleware.py'
      - 'backend/open_webui/utils/tools.py'
      - 'backend/open_webui/tools/builtin.py'
      - 'backend/open_webui/tools/knowledge_tools.py'
      - 'backend/tests/test_search_media_contract.py'
      - 'tests/migration/test_query_image_cache.py'
      - 'tests/migration/test_unified_knowledge_tools.py'
      - 'tests/migration/test_knowledge_tool_guidance.py'
      - 'tests/migration/test_evidence_reread.py'
      - '.github/workflows/search-tools.yaml'
  push:
    branches: [main, dev]
    paths:
      - 'tools/search/**'
      - 'backend/open_webui/utils/middleware.py'
      - 'backend/open_webui/utils/tools.py'
      - 'backend/open_webui/tools/builtin.py'
      - 'backend/open_webui/tools/knowledge_tools.py'
      - 'backend/tests/test_search_media_contract.py'
      - 'tests/migration/test_query_image_cache.py'
      - 'tests/migration/test_unified_knowledge_tools.py'
      - 'tests/migration/test_knowledge_tool_guidance.py'
      - 'tests/migration/test_evidence_reread.py'
      - '.github/workflows/search-tools.yaml'

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install 'pydantic>=2,<3' 'langchain-core==1.4.8' aiohttp pytest
      - name: Verify search formats and provenance without upstream requests
        run: python -m unittest discover -s tools/search/tests -p 'test_*.py'
      - name: Verify native search media and vision capability contract
        run: python -m pytest -q backend/tests/test_search_media_contract.py
      - name: Verify image attachments keep native tool definitions stable
        run: python tests/migration/test_query_image_cache.py
      - name: Verify unified knowledge sources, bounded reads and explicit evidence rereads
        run: |
          python tests/migration/test_unified_knowledge_tools.py
          python tests/migration/test_knowledge_tool_guidance.py
          python tests/migration/test_evidence_reread.py
