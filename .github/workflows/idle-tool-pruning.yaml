name: Idle Tool Pruning

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/open_webui/utils/idle_tool_pruning.py'
      - 'backend/open_webui/utils/middleware.py'
      - 'backend/open_webui/utils/context_compaction.py'
      - 'backend/open_webui/utils/native_compaction.py'
      - 'backend/open_webui/main.py'
      - 'backend/open_webui/models/chats.py'
      - 'backend/open_webui/routers/chats.py'
      - 'backend/open_webui/migrations/versions/72c3a9d1e5b0_add_tool_pruning_state.py'
      - 'tests/migration/test_idle_tool_pruning*.py'
      - '.github/workflows/idle-tool-pruning.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated test dependencies
        run: python -m pip install 'tiktoken==0.13.0' 'sqlalchemy[asyncio]==2.0.50' 'aiosqlite==0.22.1' 'alembic==1.18.4' pillow 'pydantic>=2,<3'
      - name: Verify pruning, persistence and lifecycle contracts
        run: python -m unittest discover -s tests/migration -p 'test_idle_tool_pruning*.py'
      - name: Verify existing provider replay and compaction behavior
        run: |
          python tests/migration/test_responses_native_history.py
          python tests/migration/test_responses_cumulative_history.py
          python tests/migration/test_responses_text_compaction.py
          python tests/migration/test_native_compaction.py
